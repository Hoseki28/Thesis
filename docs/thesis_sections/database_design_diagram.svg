<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-bi" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="680" fill="#2b2b2b"/>

  <!-- TIER 1 BOX -->
  <rect x="40" y="42" width="415" height="596" rx="16" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="60" y="72" fill="#9ca3af" font-size="13" font-weight="600" letter-spacing="1.2">TIER 1: EMBEDDED FLASH (ESP32 NVS)</text>

  <!-- TIER 2 BOX -->
  <rect x="485" y="42" width="590" height="596" rx="16" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="505" y="72" fill="#9ca3af" font-size="13" font-weight="600" letter-spacing="1.2">TIER 2: CLIENT WEB STORAGE (BROWSER)</text>

  <!-- TIER 3 BOX -->
  <rect x="1105" y="42" width="455" height="596" rx="16" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="1125" y="72" fill="#9ca3af" font-size="13" font-weight="600" letter-spacing="1.2">TIER 3: RUNTIME BUFFERS, 20-COL CSV &amp; CACHE</text>

  <!-- ESP32 Firmware Runtime -->
  <g filter="url(#shadow)">
    <rect x="125" y="150" width="245" height="115" rx="18" fill="#002b54" stroke="#1e4f82" stroke-width="1.8"/>
    <text x="247.5" y="182" fill="#99d1ff" font-size="15.5" font-weight="700" text-anchor="middle">ESP32 Firmware Runtime</text>
    <line x1="145" y1="194" x2="350" y2="194" stroke="#1e4f82" stroke-width="1"/>
    <text x="247.5" y="214" fill="#c7e5ff" font-size="12" text-anchor="middle">loadCalibration() on Boot</text>
    <text x="247.5" y="232" fill="#c7e5ff" font-size="12" text-anchor="middle">handleLine() Command Parser</text>
    <text x="247.5" y="250" fill="#c7e5ff" font-size="12" text-anchor="middle">1 Hz BLE / USB Telemetry Stream</text>
  </g>

  <line x1="247.5" y1="270" x2="247.5" y2="355" stroke="#9ca3af" stroke-width="1.8" marker-start="url(#arrow-bi)" marker-end="url(#arrow)"/>
  <text x="315" y="315" fill="#9ca3af" font-size="11" text-anchor="middle">prefs.getFloat / putFloat</text>

  <!-- ESP32 NVS Flash Cylinder -->
  <g filter="url(#shadow)">
    <path d="M 135 385 L 135 535 A 112.5 22 0 0 0 360 535 L 360 385 Z" fill="#002b54" stroke="#1e4f82" stroke-width="1.8"/>
    <ellipse cx="247.5" cy="385" rx="112.5" ry="22" fill="#003566" stroke="#1e4f82" stroke-width="1.8"/>
    <text x="247.5" y="432" fill="#99d1ff" font-size="15.5" font-weight="700" text-anchor="middle">ESP32 NVS Flash ("cal")</text>
    <text x="247.5" y="456" fill="#c7e5ff" font-size="12" text-anchor="middle">bat : Float32 (1.1011)</text>
    <text x="247.5" y="476" fill="#c7e5ff" font-size="12" text-anchor="middle">teg : Float32 (1.1679)</text>
    <text x="247.5" y="496" fill="#c7e5ff" font-size="12" text-anchor="middle">cur : Float32 (1.0000)</text>
    <text x="247.5" y="516" fill="#c7e5ff" font-size="12" text-anchor="middle">toh / toc : Float32 (0.00 °C)</text>
  </g>

  <!-- BLE / USB Sync Arrow -->
  <line x1="375" y1="207.5" x2="520" y2="207.5" stroke="#9ca3af" stroke-width="1.8" marker-start="url(#arrow-bi)" marker-end="url(#arrow)"/>
  <text x="447.5" y="190" fill="#99d1ff" font-size="11.5" font-weight="600" text-anchor="middle">BLE / USB Sync</text>
  <text x="447.5" y="228" fill="#9ca3af" font-size="11" text-anchor="middle">B, G, I, TH, TC, TX, X</text>

  <!-- Persistence & Sync Service -->
  <g filter="url(#shadow)">
    <rect x="526" y="150" width="245" height="115" rx="18" fill="#002b54" stroke="#1e4f82" stroke-width="1.8"/>
    <text x="648.5" y="182" fill="#99d1ff" font-size="15.5" font-weight="700" text-anchor="middle">Persistence &amp; Sync Service</text>
    <line x1="546" y1="194" x2="751" y2="194" stroke="#1e4f82" stroke-width="1"/>
    <text x="648.5" y="214" fill="#c7e5ff" font-size="12" text-anchor="middle">hardwareBridge.ts (1 Hz Ingest)</text>
    <text x="648.5" y="232" fill="#c7e5ff" font-size="12" text-anchor="middle">calibrationStorage.ts (v5 JSON)</text>
    <text x="648.5" y="250" fill="#c7e5ff" font-size="12" text-anchor="middle">Authoritative NVS Trim Sync</text>
  </g>

  <line x1="648.5" y1="270" x2="648.5" y2="355" stroke="#9ca3af" stroke-width="1.8" marker-start="url(#arrow-bi)" marker-end="url(#arrow)"/>
  <text x="702" y="315" fill="#9ca3af" font-size="11" text-anchor="middle">getItem / setItem</text>

  <!-- Browser Web Storage Cylinder -->
  <g filter="url(#shadow)">
    <path d="M 526 385 L 526 535 A 122.5 22 0 0 0 771 535 L 771 385 Z" fill="#002b54" stroke="#1e4f82" stroke-width="1.8"/>
    <ellipse cx="648.5" cy="385" rx="122.5" ry="22" fill="#003566" stroke="#1e4f82" stroke-width="1.8"/>
    <text x="648.5" y="432" fill="#99d1ff" font-size="15.5" font-weight="700" text-anchor="middle">Browser Web Storage</text>
    <text x="648.5" y="456" fill="#c7e5ff" font-size="12" text-anchor="middle">padayon_calibration_v5 (JSON)</text>
    <text x="648.5" y="476" fill="#c7e5ff" font-size="12" text-anchor="middle">padayon_theme ('dark' | 'light')</text>
    <text x="648.5" y="496" fill="#c7e5ff" font-size="12" text-anchor="middle">padayon_lang ('en' | 'fil')</text>
    <text x="648.5" y="516" fill="#c7e5ff" font-size="12" text-anchor="middle">bteg_session_start_ms (Session)</text>
  </g>

  <line x1="775" y1="207.5" x2="810" y2="207.5" stroke="#9ca3af" stroke-width="1.8" marker-start="url(#arrow-bi)" marker-end="url(#arrow)"/>

  <!-- React 19 State & UI -->
  <g filter="url(#shadow)">
    <rect x="815" y="150" width="235" height="115" rx="18" fill="#002b54" stroke="#1e4f82" stroke-width="1.8"/>
    <text x="932.5" y="182" fill="#99d1ff" font-size="15.5" font-weight="700" text-anchor="middle">React 19 State &amp; UI</text>
    <line x1="835" y1="194" x2="1030" y2="194" stroke="#1e4f82" stroke-width="1"/>
    <text x="932.5" y="214" fill="#c7e5ff" font-size="12" text-anchor="middle">App.tsx Telemetry State</text>
    <text x="932.5" y="232" fill="#c7e5ff" font-size="12" text-anchor="middle">CalibrationStudio.tsx Form</text>
    <text x="932.5" y="250" fill="#c7e5ff" font-size="12" text-anchor="middle">LogsTab.tsx 15m Export Trigger</text>
  </g>

  <!-- Volatile Ring Buffers Cylinder -->
  <g filter="url(#shadow)">
    <path d="M 1140 150 L 1140 280 A 105 20 0 0 0 1350 280 L 1350 150 Z" fill="#002b54" stroke="#1e4f82" stroke-width="1.8"/>
    <ellipse cx="1245" cy="150" rx="105" ry="20" fill="#003566" stroke="#1e4f82" stroke-width="1.8"/>
    <text x="1245" y="192" fill="#99d1ff" font-size="15.5" font-weight="700" text-anchor="middle">Volatile Ring Buffers</text>
    <text x="1245" y="216" fill="#c7e5ff" font-size="12" text-anchor="middle">telemetryHistory (36,000 rows)</text>
    <text x="1245" y="236" fill="#c7e5ff" font-size="12" text-anchor="middle">systemLogService (50 events)</text>
    <text x="1245" y="256" fill="#c7e5ff" font-size="12" text-anchor="middle">filterByInterval (15m/5m/1m/1s)</text>
  </g>

  <line x1="1355" y1="215" x2="1390" y2="215" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Excel .CSV File -->
  <g filter="url(#shadow)">
    <rect x="1395" y="150" width="145" height="125" rx="18" fill="#002b54" stroke="#1e4f82" stroke-width="1.8"/>
    <text x="1467.5" y="184" fill="#99d1ff" font-size="15" font-weight="700" text-anchor="middle">Excel .CSV File</text>
    <line x1="1412" y1="196" x2="1523" y2="196" stroke="#1e4f82" stroke-width="1"/>
    <text x="1467.5" y="216" fill="#c7e5ff" font-size="11.5" text-anchor="middle">20-Column Schema</text>
    <text x="1467.5" y="234" fill="#c7e5ff" font-size="11.5" text-anchor="middle">Split Date &amp; Time PHT</text>
    <text x="1467.5" y="252" fill="#c7e5ff" font-size="11.5" text-anchor="middle">15m / 5m / 1m / 1s</text>
  </g>

  <!-- Offline CacheStorage Cylinder -->
  <g filter="url(#shadow)">
    <path d="M 1230 390 L 1230 520 A 115 20 0 0 0 1460 520 L 1460 390 Z" fill="#002b54" stroke="#1e4f82" stroke-width="1.8"/>
    <ellipse cx="1345" cy="390" rx="115" ry="20" fill="#003566" stroke="#1e4f82" stroke-width="1.8"/>
    <text x="1345" y="434" fill="#99d1ff" font-size="15.5" font-weight="700" text-anchor="middle">Offline CacheStorage</text>
    <text x="1345" y="458" fill="#c7e5ff" font-size="12" text-anchor="middle">Cache: teg-monitoring-pwa-v4.15</text>
    <text x="1345" y="478" fill="#c7e5ff" font-size="12" text-anchor="middle">Precached App Shell &amp; Icons</text>
    <text x="1345" y="498" fill="#c7e5ff" font-size="12" text-anchor="middle">Runtime JS / CSS Bundles</text>
  </g>

  <!-- Routing Lines from React 19 State & UI to Tier 3 -->
  <path d="M 932.5 265 L 932.5 318 L 1148 318 L 1148 278" fill="none" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 932.5 318 L 932.5 462 L 1222 462" fill="none" stroke="#9ca3af" stroke-width="1.8" marker-start="url(#arrow-bi)" marker-end="url(#arrow)"/>
  <text x="1080" y="448" fill="#9ca3af" font-size="11" text-anchor="middle">Service Worker (public/sw.js)</text>
</svg>